<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aerial Interchange Tile-Rotation Puzzle</title>

  <!-- Start downloading the image immediately before CSS/JS even finishes -->
  <link rel="preload" as="image" href="for%20puzzel2.jpg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pixelated Retro Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Strictly zero animation on tile rotations */
    .puzzle-tile {
      transition: none !important;
      animation: none !important;
      will-change: transform;
      cursor: pointer;
      background-repeat: no-repeat;
      transform-origin: center center;
    }

    /* Crisp retro pixel text with no background box, no stroke, and no shadow */
    .pixel-prompt {
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      font-size: clamp(8px, 1.35vw, 12px);
      -webkit-text-stroke: 0;
      text-shadow: none;
      background: transparent;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="w-full h-full bg-white flex items-center justify-center overflow-hidden">

  <!-- Hidden file picker fallback only if local image cannot be read -->
  <input id="fallbackFileInput" type="file" accept="image/*" class="hidden" />

  <!-- Centered Vertical Game Stage -->
  <main id="stageArea" class="w-full h-full flex items-center justify-center p-2 bg-white">
    <div id="boardWrapper" class="relative overflow-hidden bg-white">
      <!-- Vertical 4x8 Medium Square Grid (32 true 1:1 squares) -->
      <div id="puzzleGrid" class="grid grid-cols-4 grid-rows-8 w-full h-full gap-0"></div>

      <!-- Minimal Pixelated Prompt Overlay -->
      <div id="attractOverlay" class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none px-4 text-center">
        <span class="pixel-prompt uppercase">
          TAP ANYWHERE TO START
        </span>
      </div>
    </div>
  </main>

  <script>
    const state = {
      mode: 'ATTRACT', // 'ATTRACT' | 'PLAYING' | 'SOLVED'
      cols: 4,
      rows: 8,
      angles: [],
      tileElements: [],
      attractInterval: null,
      solvedTimeout: null,
      imageUrl: 'for%20puzzel2.jpg',
      imageLoaded: false
    };

    const stageArea = document.getElementById('stageArea');
    const boardWrapper = document.getElementById('boardWrapper');
    const puzzleGrid = document.getElementById('puzzleGrid');
    const attractOverlay = document.getElementById('attractOverlay');
    const fallbackFileInput = document.getElementById('fallbackFileInput');

    /**
     * Rotates the image 90 degrees clockwise onto an appropriately sized canvas
     * (capped at 1400px tall so it renders instantaneously without lagging).
     */
    function orientImageVertically(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return null;

      if (img.naturalWidth > img.naturalHeight) {
        try {
          const maxDim = 1400;
          const scale = Math.min(1, maxDim / img.naturalWidth);
          const targetW = Math.round(img.naturalHeight * scale);
          const targetH = Math.round(img.naturalWidth * scale);

          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');
          ctx.translate(targetW / 2, targetH / 2);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(img, -targetH / 2, -targetW / 2, targetH, targetW);
          return canvas.toDataURL('image/jpeg', 0.9);
        } catch (err) {
          return img.src;
        }
      }

      return img.src;
    }

    function applyImageToTiles(url) {
      state.imageUrl = url;
      const { cols, rows } = state;
      state.tileElements.forEach((tile, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const posX = cols > 1 ? (c / (cols - 1)) * 100 : 0;
        const posY = rows > 1 ? (r / (rows - 1)) * 100 : 0;
        tile.style.backgroundImage = `url("${url}")`;
        tile.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
        tile.style.backgroundPosition = `${posX}% ${posY}%`;
      });
    }

    function buildPuzzleGrid() {
      const { cols, rows } = state;
      const total = cols * rows;

      puzzleGrid.innerHTML = '';
      state.angles = new Array(total).fill(0);
      state.tileElements = [];

      for (let i = 0; i < total; i++) {
        const tile = document.createElement('div');
        tile.className = 'puzzle-tile relative w-full h-full aspect-square overflow-hidden';
        tile.dataset.index = String(i);

        tile.addEventListener('pointerdown', (e) => {
          if (state.mode !== 'PLAYING') return;
          e.preventDefault();
          e.stopPropagation();

          if (!state.imageLoaded) {
            fallbackFileInput.click();
            return;
          }

          rotateTile(i);
        });

        puzzleGrid.appendChild(tile);
        state.tileElements.push(tile);
      }

      fitBoardToViewport();
    }

    function fitBoardToViewport() {
      const stageRect = stageArea.getBoundingClientRect();
      const availW = Math.max(140, stageRect.width - 16);
      const availH = Math.max(280, stageRect.height - 16);

      const gridRatio = state.cols / state.rows;
      let boardH = availH;
      let boardW = boardH * gridRatio;

      if (boardW > availW) {
        boardW = availW;
        boardH = boardW / gridRatio;
      }

      const squareSize = Math.floor(boardH / state.rows);
      boardWrapper.style.width = `${squareSize * state.cols}px`;
      boardWrapper.style.height = `${squareSize * state.rows}px`;
    }

    function setTileAngle(index, angle) {
      const normalized = ((angle % 360) + 360) % 360;
      state.angles[index] = normalized;
      const tile = state.tileElements[index];
      if (tile) {
        tile.style.transform = `rotate(${normalized}deg)`;
      }
    }

    function rotateTile(index) {
      if (state.mode !== 'PLAYING') return;
      setTileAngle(index, state.angles[index] + 90);
      checkSolved();
    }

    function checkSolved() {
      const allUpright = state.angles.every((deg) => deg === 0);
      if (allUpright) {
        state.mode = 'SOLVED';
        state.solvedTimeout = setTimeout(() => {
          if (state.mode === 'SOLVED') {
            startAttractMode();
          }
        }, 1500);
      }
    }

    function startAttractMode() {
      stopAttractMode();
      if (state.solvedTimeout) {
        clearTimeout(state.solvedTimeout);
        state.solvedTimeout = null;
      }

      state.mode = 'ATTRACT';
      attractOverlay.classList.remove('hidden');

      const total = state.cols * state.rows;
      const validAngles = [0, 90, 180, 270];

      for (let i = 0; i < total; i++) {
        const randAngle = validAngles[Math.floor(Math.random() * validAngles.length)];
        setTileAngle(i, randAngle);
      }

      state.attractInterval = setInterval(() => {
        if (state.mode !== 'ATTRACT') return;
        const batchCount = Math.max(4, Math.floor(total * 0.25));
        for (let b = 0; b < batchCount; b++) {
          const idx = Math.floor(Math.random() * total);
          const current = state.angles[idx];
          const choices = validAngles.filter((a) => a !== current);
          const next = choices[Math.floor(Math.random() * choices.length)];
          setTileAngle(idx, next);
        }
      }, 140);
    }

    function stopAttractMode() {
      if (state.attractInterval) {
        clearInterval(state.attractInterval);
        state.attractInterval = null;
      }
    }

    function freezeAndStartGame() {
      stopAttractMode();
      state.mode = 'PLAYING';
      attractOverlay.classList.add('hidden');

      if (state.angles.every((deg) => deg === 0)) {
        const idx = Math.floor(Math.random() * state.angles.length);
        setTileAngle(idx, 90);
      }
    }

    document.addEventListener('pointerdown', (e) => {
      if (state.mode === 'ATTRACT') {
        e.preventDefault();
        freezeAndStartGame();
      } else if (state.mode === 'SOLVED') {
        e.preventDefault();
        startAttractMode();
      }
    });

    fallbackFileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const objectUrl = URL.createObjectURL(e.target.files[0]);
        const tempImg = new Image();
        tempImg.onload = () => {
          state.imageLoaded = true;
          applyImageToTiles(orientImageVertically(tempImg) || objectUrl);
        };
        tempImg.src = objectUrl;
      }
    });

    window.addEventListener('resize', fitBoardToViewport);

    // Build grid and fetch image immediately without waiting for external fonts/scripts
    buildPuzzleGrid();
    startAttractMode();

    const img = new Image();
    img.onload = () => {
      state.imageLoaded = true;
      const verticalUrl = orientImageVertically(img) || 'for%20puzzel2.jpg';
      applyImageToTiles(verticalUrl);
    };
    img.src = 'for%20puzzel2.jpg';
  </script>
</body>
</html>
