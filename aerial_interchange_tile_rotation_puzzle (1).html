<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aerial Interchange Tile-Rotation Puzzle</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pixelated Retro Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Strictly zero animation on tile rotations */
    .puzzle-tile {
      transition: none !important;
      animation: none !important;
      will-change: transform;
      cursor: pointer;
      background-repeat: no-repeat;
      transform-origin: center center;
    }

    /* Crisp retro pixel text with no background box, no stroke, and no shadow */
    .pixel-prompt {
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      font-size: clamp(8px, 1.35vw, 12px);
      -webkit-text-stroke: 0;
      text-shadow: none;
      background: transparent;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="w-full h-full bg-white flex items-center justify-center overflow-hidden">

  <!-- Hidden file picker fallback only used if sandbox blocks local image files -->
  <input id="fallbackFileInput" type="file" accept="image/*" class="hidden" />

  <!-- Centered Vertical Game Stage -->
  <main id="stageArea" class="w-full h-full flex items-center justify-center p-2 bg-white">
    <div id="boardWrapper" class="relative overflow-hidden bg-white">
      <!-- Vertical 4x8 Medium Square Grid (32 true 1:1 squares) -->
      <div id="puzzleGrid" class="grid grid-cols-4 grid-rows-8 w-full h-full gap-0"></div>

      <!-- Minimal Pixelated Prompt Overlay (No background box, no stroke, no extra text) -->
      <div id="attractOverlay" class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none px-4 text-center">
        <span class="pixel-prompt uppercase">
          TAP ANYWHERE TO START
        </span>
      </div>
    </div>
  </main>

  <script>
    /**
     * Ultra-Minimalist Vertical Digital Tile-Rotation Puzzle
     * - Orients the exact uploaded image vertically (90° portrait orientation) with zero color edits
     * - Single fixed vertical medium square grid (4 columns x 8 rows = 32 true 1:1 squares)
     * - Continuous instant 90-degree random rotations on open until user taps anywhere
     * - Instant 0ms 90-degree clockwise tile rotation on tap during solve
     */

    const state = {
      mode: 'ATTRACT', // 'ATTRACT' | 'PLAYING' | 'SOLVED'
      cols: 4,
      rows: 8,
      angles: [],
      tileElements: [],
      attractInterval: null,
      imageUrl: 'for%20puzzel2_2.jpg',
      imageLoaded: false
    };

    const stageArea = document.getElementById('stageArea');
    const boardWrapper = document.getElementById('boardWrapper');
    const puzzleGrid = document.getElementById('puzzleGrid');
    const attractOverlay = document.getElementById('attractOverlay');
    const fallbackFileInput = document.getElementById('fallbackFileInput');

    /**
     * Rotates a loaded image 90 degrees clockwise onto an offscreen canvas
     * so a landscape image fills the vertical 4x8 portrait grid cleanly without distortion.
     */
    function orientImageVertically(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return null;
      if (img.naturalHeight >= img.naturalWidth) return img.src;

      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalHeight;
        canvas.height = img.naturalWidth;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        return canvas.toDataURL('image/jpeg', 0.96);
      } catch (err) {
        return img.src;
      }
    }

    /**
     * Resolves the exact uploaded image ('for puzzel2_2.jpg' first, then 'for puzzel2.jpg')
     * and orients it vertically for the 4x8 portrait grid.
     */
    function resolveExactImage() {
      const candidates = [
        'for puzzel2_2.jpg',
        'for%20puzzel2_2.jpg',
        './for puzzel2_2.jpg',
        './for%20puzzel2_2.jpg',
        'for puzzel2.jpg',
        'for%20puzzel2.jpg',
        './for puzzel2.jpg',
        './for%20puzzel2.jpg'
      ];

      return new Promise((resolve) => {
        let index = 0;

        function tryNext() {
          if (index >= candidates.length) {
            state.imageUrl = 'for%20puzzel2_2.jpg';
            state.imageLoaded = false;
            resolve(null);
            return;
          }

          const candidateUrl = candidates[index++];
          const img = new Image();

          img.onload = () => {
            if (img.naturalWidth > 0) {
              const verticalUrl = orientImageVertically(img) || candidateUrl;
              state.imageUrl = verticalUrl;
              state.imageLoaded = true;
              resolve(img);
            } else {
              tryNext();
            }
          };

          img.onerror = () => {
            tryNext();
          };

          img.src = candidateUrl;
        }

        tryNext();
      });
    }

    /**
     * Applies the current imageUrl across all 32 vertical square tiles cleanly.
     */
    function applyImageToTiles(url) {
      state.imageUrl = url;
      const { cols, rows } = state;
      state.tileElements.forEach((tile, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const posX = cols > 1 ? (c / (cols - 1)) * 100 : 0;
        const posY = rows > 1 ? (r / (rows - 1)) * 100 : 0;
        tile.style.backgroundImage = `url("${url}")`;
        tile.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
        tile.style.backgroundPosition = `${posX}% ${posY}%`;
      });
    }

    /**
     * Builds the single fixed vertical medium grid (4x8) of exact 1:1 square tiles,
     * slicing the exact image seamlessly with zero borders or gaps.
     */
    function buildPuzzleGrid() {
      const { cols, rows, imageUrl } = state;
      const total = cols * rows;

      puzzleGrid.innerHTML = '';
      state.angles = new Array(total).fill(0);
      state.tileElements = [];

      for (let i = 0; i < total; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;

        const tile = document.createElement('div');
        tile.className = 'puzzle-tile relative w-full h-full aspect-square overflow-hidden';
        tile.dataset.index = String(i);

        const posX = cols > 1 ? (c / (cols - 1)) * 100 : 0;
        const posY = rows > 1 ? (r / (rows - 1)) * 100 : 0;

        tile.style.backgroundImage = `url("${imageUrl}")`;
        tile.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
        tile.style.backgroundPosition = `${posX}% ${posY}%`;

        tile.addEventListener('pointerdown', (e) => {
          if (state.mode !== 'PLAYING') return;
          e.preventDefault();
          e.stopPropagation();

          if (!state.imageLoaded) {
            fallbackFileInput.click();
            return;
          }

          rotateTile(i);
        });

        puzzleGrid.appendChild(tile);
        state.tileElements.push(tile);
      }

      fitBoardToViewport();
    }

    /**
     * Sizes the centered vertical board so every tile is a true 1:1 square fitting within the viewport.
     */
    function fitBoardToViewport() {
      const stageRect = stageArea.getBoundingClientRect();
      const availW = Math.max(140, stageRect.width - 16);
      const availH = Math.max(280, stageRect.height - 16);

      const gridRatio = state.cols / state.rows;
      let boardH = availH;
      let boardW = boardH * gridRatio;

      if (boardW > availW) {
        boardW = availW;
        boardH = boardW / gridRatio;
      }

      const squareSize = Math.floor(boardH / state.rows);
      boardWrapper.style.width = `${squareSize * state.cols}px`;
      boardWrapper.style.height = `${squareSize * state.rows}px`;
    }

    /**
     * Applies instantaneous 90-degree rotation with ZERO animation.
     */
    function setTileAngle(index, angle) {
      const normalized = ((angle % 360) + 360) % 360;
      state.angles[index] = normalized;
      const tile = state.tileElements[index];
      if (tile) {
        tile.style.transform = `rotate(${normalized}deg)`;
      }
    }

    /**
     * Rotates a single tile 90 degrees clockwise on tap and checks for puzzle completion.
     */
    function rotateTile(index) {
      if (state.mode !== 'PLAYING') return;
      setTileAngle(index, state.angles[index] + 90);
      checkSolved();
    }

    /**
     * Checks if all 32 tiles are upright (0°); if solved, restarts video mode on next tap.
     */
    function checkSolved() {
      const allUpright = state.angles.every((deg) => deg === 0);
      if (allUpright) {
        state.mode = 'SOLVED';
      }
    }

    /**
     * Starts the continuous kinetic video attract loop where random tiles snap to
     * random 90-degree orientations until the user taps anywhere on the screen.
     */
    function startAttractMode() {
      stopAttractMode();
      state.mode = 'ATTRACT';
      attractOverlay.classList.remove('hidden');

      const total = state.cols * state.rows;
      const validAngles = [0, 90, 180, 270];

      // Initial scramble
      for (let i = 0; i < total; i++) {
        const randAngle = validAngles[Math.floor(Math.random() * validAngles.length)];
        setTileAngle(i, randAngle);
      }

      // Rapid instant-snap updates (no smooth animation)
      state.attractInterval = setInterval(() => {
        if (state.mode !== 'ATTRACT') return;
        const batchCount = Math.max(4, Math.floor(total * 0.25));
        for (let b = 0; b < batchCount; b++) {
          const idx = Math.floor(Math.random() * total);
          const current = state.angles[idx];
          const choices = validAngles.filter((a) => a !== current);
          const next = choices[Math.floor(Math.random() * choices.length)];
          setTileAngle(idx, next);
        }
      }, 140);
    }

    /**
     * Stops the attract loop.
     */
    function stopAttractMode() {
      if (state.attractInterval) {
        clearInterval(state.attractInterval);
        state.attractInterval = null;
      }
    }

    /**
     * Freezes the board when the user taps anywhere, guaranteeing a solvable scrambled state.
     */
    function freezeAndStartGame() {
      stopAttractMode();
      state.mode = 'PLAYING';
      attractOverlay.classList.add('hidden');

      if (state.angles.every((deg) => deg === 0)) {
        const idx = Math.floor(Math.random() * state.angles.length);
        setTileAngle(idx, 90);
      }
    }

    // Tap anywhere on screen during ATTRACT to freeze and play, or after SOLVED to restart
    document.addEventListener('pointerdown', (e) => {
      if (state.mode === 'ATTRACT') {
        e.preventDefault();
        freezeAndStartGame();
      } else if (state.mode === 'SOLVED') {
        e.preventDefault();
        startAttractMode();
      }
    });

    // Support drag-and-drop or fallback file selection if sandbox blocks local image files
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      if (!state.imageLoaded && e.dataTransfer && e.dataTransfer.files[0]) {
        e.preventDefault();
        const objectUrl = URL.createObjectURL(e.dataTransfer.files[0]);
        const tempImg = new Image();
        tempImg.onload = () => {
          state.imageLoaded = true;
          applyImageToTiles(orientImageVertically(tempImg) || objectUrl);
        };
        tempImg.src = objectUrl;
      }
    });

    fallbackFileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const objectUrl = URL.createObjectURL(e.target.files[0]);
        const tempImg = new Image();
        tempImg.onload = () => {
          state.imageLoaded = true;
          applyImageToTiles(orientImageVertically(tempImg) || objectUrl);
        };
        tempImg.src = objectUrl;
      }
    });

    window.addEventListener('resize', fitBoardToViewport);

    // Initialize on load
    window.addEventListener('load', async () => {
      buildPuzzleGrid();
      startAttractMode();
      const loadedImg = await resolveExactImage();
      if (loadedImg) {
        applyImageToTiles(state.imageUrl);
      }
    });
  </script>
</body>
</html>
